<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="fogGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="50" cy="50" r="42" fill="url(#fogGrad)" />
  <!-- Shield Outer -->
  <path d="M50 12 L82 24 V52 C82 72 50 88 50 88 C50 88 18 72 18 52 V24 L50 12 Z" 
        stroke="url(#shieldGrad)" stroke-width="3.5" fill="#070d1d" fill-opacity="0.85" filter="url(#glow)"/>
  <!-- Fog / Energy Clouds inside -->
  <path d="M35 56 C33 46 44 42 50 46 C56 38 68 44 64 54 C68 62 58 66 50 64 C42 66 32 62 35 56 Z" 
        fill="#38bdf8" fill-opacity="0.25" />
  <!-- Core Symbol: Radar & Bolt / Eye of Security -->
  <circle cx="50" cy="50" r="14" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
  <circle cx="50" cy="50" r="5" fill="#38bdf8" />
  <!-- Tactical Crosshairs -->
  <line x1="50" y1="28" x2="50" y2="35" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="65" x2="50" y2="72" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="50" x2="35" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="50" x2="72" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
</svg>
